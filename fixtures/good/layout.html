<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="i18n" content="/locales" data-available="en">
</head>
<body>
  <!-- Localizable interface copy and ordinary document content coexist. -->

    <h1 data-i18n="page_title"></h1>

    <article><p>Hello World</p><pre>Literal document content.</pre></article>
  </main>
</body>
</html>
